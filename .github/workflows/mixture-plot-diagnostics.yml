name: mixture-plot-diagnostics

'on':
  pull_request:
    paths:
      - '.github/scripts/diagnose-mixture-plots.R'
      - '.github/workflows/mixture-plot-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-diagnostics:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REMOTES_UPGRADE: never
      RENV_CONFIG_INSTALL_JOBS: 1
      RENV_CONFIG_INSTALL_STAGED: false
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
      RENV_CONFIG_PAK_ENABLED: false
      PKG_BUILD_CORES: 1
      MIXTURE_DIAGNOSTIC_FRESH_INSTALL: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          Ncpus: 1
      - uses: r-hub/actions/setup-r-sysreqs@v1
        with:
          type: full
      - name: Match CI renv setup
        run: |
          utils::install.packages("renv")
          renv::install("rstudio/renv@44b3f47219d103b866c44fcff61e3d81e1b6cb9f")
        shell: Rscript {0}
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 6
      - name: Setup jaspTools
        run: |
          if (!requireNamespace("jaspTools", quietly = TRUE)) renv::install("jasp-stats/jaspTools")
          jaspTools::setupJaspTools()
        shell: Rscript {0}
      - name: Capture sampling and source state
        run: Rscript .github/scripts/diagnose-mixture-plots.R
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mixture-plot-diagnostics-macos
          path: .work/mixture-plot-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
